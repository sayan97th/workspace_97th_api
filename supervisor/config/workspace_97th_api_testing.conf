; =============================================================================
; Supervisor Configuration — Workspace 97th API (TESTING)
; App path: /var/www/api.workspace97th.97dev.com
;
; INSTALLATION
; ------------
; 1. Copy this file to /etc/supervisor/conf.d/workspace_97th_api.conf
; 2. Run: sudo supervisorctl reread && sudo supervisorctl update
; 3. Run: sudo supervisorctl start workspace_97th_api:*
;
; Or simply run: bash supervisor/testing.sh
;
; NOTE: Adjust `user`, `directory`, and `command` paths to match your server.
; =============================================================================


; -----------------------------------------------------------------------------
; [1] Laravel Horizon — manages all queue workers (default + emails queues)
;     Horizon internally spawns the supervisor-1 and supervisor-emails workers
;     defined in config/horizon.php. No separate queue:work processes needed.
; -----------------------------------------------------------------------------
[program:workspace_97th_api_horizon]
process_name    = %(program_name)s
command         = php /var/www/api.workspace97th.97dev.com/artisan horizon
directory       = /var/www/api.workspace97th.97dev.com
autostart       = true
autorestart     = true
user            = www-data
numprocs        = 1
redirect_stderr = true
stdout_logfile  = /var/www/api.workspace97th.97dev.com/storage/logs/horizon.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups  = 5
stopwaitsecs    = 3600
stopsignal      = SIGTERM
startsecs       = 5
startretries    = 3
priority        = 100


; -----------------------------------------------------------------------------
; [2] Laravel Scheduler — runs the scheduled tasks defined in routes/console.php
;     (expired team invitations cleanup, horizon:snapshot, etc.).
;     Alternative: add `* * * * * www-data php artisan schedule:run` to crontab.
;     Use this program ONLY if you prefer supervisor over cron.
; -----------------------------------------------------------------------------
[program:workspace_97th_api_scheduler]
process_name    = %(program_name)s
command         = php /var/www/api.workspace97th.97dev.com/artisan schedule:work
directory       = /var/www/api.workspace97th.97dev.com
autostart       = true
autorestart     = true
user            = www-data
numprocs        = 1
redirect_stderr = true
stdout_logfile  = /var/www/api.workspace97th.97dev.com/storage/logs/scheduler.log
stdout_logfile_maxbytes = 20MB
stdout_logfile_backups  = 3
stopwaitsecs    = 60
stopsignal      = SIGTERM
startsecs       = 5
startretries    = 3
priority        = 200


; -----------------------------------------------------------------------------
; [3] Laravel Reverb — WebSocket server for real-time broadcasting
;     Runs the WebSocket server used by Laravel Echo / broadcasting system.
;     Port is defined via REVERB_PORT in .env (currently 8081).
;     IMPORTANT: Do NOT use --debug in production environments.
; -----------------------------------------------------------------------------
[program:workspace_97th_api_reverb]
process_name    = %(program_name)s
command         = php /var/www/api.workspace97th.97dev.com/artisan reverb:start
directory       = /var/www/api.workspace97th.97dev.com
autostart       = true
autorestart     = true
user            = www-data
numprocs        = 1
redirect_stderr = true
stdout_logfile  = /var/www/api.workspace97th.97dev.com/storage/logs/reverb.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups  = 5
stopwaitsecs    = 60
stopsignal      = SIGTERM
startsecs       = 5
startretries    = 3
priority        = 150

; -----------------------------------------------------------------------------
; [group] — manage all programs as a single group
; -----------------------------------------------------------------------------
[group:workspace_97th_api]
programs = workspace_97th_api_horizon,workspace_97th_api_scheduler,workspace_97th_api_reverb
priority = 999
