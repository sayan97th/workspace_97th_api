; =============================================================================
; Supervisor Configuration — Workspace 97th API (LOCAL / Arch Linux)
; App path: /mnt/linux-storage/projects/97thfloor/monday_projects/workspace_97th_api
;
; INSTALLATION
; ------------
; 1. Copy this file to /etc/supervisor.d/workspace_97th_api_local.conf
; 2. Run: sudo supervisorctl reread && sudo supervisorctl update
; 3. Run: sudo supervisorctl start workspace_97th_api:*
;
; Or simply run: bash supervisor/archlinux.sh
;
; NOTE: Adjust `user`, `directory`, and `command` paths to match your machine.
; =============================================================================


; -----------------------------------------------------------------------------
; [1] Laravel Horizon — manages all queue workers (default + emails queues)
;     Horizon internally spawns the supervisor-1 and supervisor-emails workers
;     defined in config/horizon.php. No separate queue:work processes needed.
; -----------------------------------------------------------------------------
[program:workspace_97th_api_horizon]
process_name    = %(program_name)s
command         = php /mnt/linux-storage/projects/97thfloor/monday_projects/workspace_97th_api/artisan horizon
directory       = /mnt/linux-storage/projects/97thfloor/monday_projects/workspace_97th_api
autostart       = true
autorestart     = true
user            = http
numprocs        = 1
redirect_stderr = true
stdout_logfile  = /mnt/linux-storage/projects/97thfloor/monday_projects/workspace_97th_api/storage/logs/horizon.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups  = 5
stopwaitsecs    = 3600
stopsignal      = SIGTERM
startsecs       = 5
startretries    = 3
priority        = 100


; -----------------------------------------------------------------------------
; [2] Laravel Scheduler — runs the scheduled tasks defined in routes/console.php
;     (expired team invitations cleanup, horizon:snapshot, etc.).
;     Alternative: add `* * * * * http php artisan schedule:run` to crontab.
;     Use this program ONLY if you prefer supervisor over cron.
; -----------------------------------------------------------------------------
[program:workspace_97th_api_scheduler]
process_name    = %(program_name)s
command         = php /mnt/linux-storage/projects/97thfloor/monday_projects/workspace_97th_api/artisan schedule:work
directory       = /mnt/linux-storage/projects/97thfloor/monday_projects/workspace_97th_api
autostart       = true
autorestart     = true
user            = http
numprocs        = 1
redirect_stderr = true
stdout_logfile  = /mnt/linux-storage/projects/97thfloor/monday_projects/workspace_97th_api/storage/logs/scheduler.log
stdout_logfile_maxbytes = 20MB
stdout_logfile_backups  = 3
stopwaitsecs    = 60
stopsignal      = SIGTERM
startsecs       = 5
startretries    = 3
priority        = 200


; -----------------------------------------------------------------------------
; [3] Laravel Reverb — WebSocket server for real-time broadcasting
;     Runs the WebSocket server used by Laravel Echo / broadcasting system.
;     Port is defined via REVERB_PORT in .env (currently 8081).
;     IMPORTANT: Do NOT use --debug in production environments.
; -----------------------------------------------------------------------------
[program:workspace_97th_api_reverb]
process_name    = %(program_name)s
command         = php /mnt/linux-storage/projects/97thfloor/monday_projects/workspace_97th_api/artisan reverb:start
directory       = /mnt/linux-storage/projects/97thfloor/monday_projects/workspace_97th_api
autostart       = true
autorestart     = true
user            = http
numprocs        = 1
redirect_stderr = true
stdout_logfile  = /mnt/linux-storage/projects/97thfloor/monday_projects/workspace_97th_api/storage/logs/reverb.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups  = 5
stopwaitsecs    = 60
stopsignal      = SIGTERM
startsecs       = 5
startretries    = 3
priority        = 150


; -----------------------------------------------------------------------------
; [group] — manage all programs as a single group
; -----------------------------------------------------------------------------
[group:workspace_97th_api]
programs = workspace_97th_api_horizon,workspace_97th_api_scheduler,workspace_97th_api_reverb
priority = 999
