; =============================================================================
; Supervisor Configuration — Workspace 97th API (PRODUCTION)
; App path: /var/www/workspace_97th_api
;
; INSTALLATION
; ------------
; 1. Copy this file to /etc/supervisor/conf.d/workspace_97th_api.conf
; 2. Run: sudo supervisorctl reread && sudo supervisorctl update
; 3. Run: sudo supervisorctl start workspace_97th_api:*
;
; Or simply run: bash supervisor/produccion.sh
;
; NOTE: Adjust `user`, `directory`, and `command` paths to match your server.
; =============================================================================


; -----------------------------------------------------------------------------
; [1] Laravel Horizon — manages all queue workers (default + emails queues)
;     Horizon internally spawns the supervisor-1 and supervisor-emails workers
;     defined in config/horizon.php. No separate queue:work processes needed.
; -----------------------------------------------------------------------------
[program:workspace_97th_api_horizon]
process_name    = %(program_name)s
command         = php /var/www/workspace_97th_api/artisan horizon
directory       = /var/www/workspace_97th_api
autostart       = true
autorestart     = true
user            = www-data
numprocs        = 1
redirect_stderr = true
stdout_logfile  = /var/www/workspace_97th_api/storage/logs/horizon.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups  = 5
stopwaitsecs    = 3600
stopsignal      = SIGTERM
startsecs       = 5
startretries    = 3
priority        = 100


; -----------------------------------------------------------------------------
; [2] Laravel Scheduler — runs the scheduled tasks defined in routes/console.php
;     (expired team invitations cleanup, horizon:snapshot, etc.).
;     Alternative: add `* * * * * www-data php artisan schedule:run` to crontab.
;     Use this program ONLY if you prefer supervisor over cron.
; -----------------------------------------------------------------------------
[program:workspace_97th_api_scheduler]
process_name    = %(program_name)s
command         = php /var/www/workspace_97th_api/artisan schedule:work
directory       = /var/www/workspace_97th_api
autostart       = true
autorestart     = true
user            = www-data
numprocs        = 1
redirect_stderr = true
stdout_logfile  = /var/www/workspace_97th_api/storage/logs/scheduler.log
stdout_logfile_maxbytes = 20MB
stdout_logfile_backups  = 3
stopwaitsecs    = 60
stopsignal      = SIGTERM
startsecs       = 5
startretries    = 3
priority        = 200


; -----------------------------------------------------------------------------
; [group] — manage all programs as a single group
; -----------------------------------------------------------------------------
[group:workspace_97th_api]
programs = workspace_97th_api_horizon,workspace_97th_api_scheduler
priority = 999
