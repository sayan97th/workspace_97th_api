# =============================================================================
# Nginx Virtual Host — Workspace 97th API (Testing)
# Domain  : api.workspace97th.97dev.com
# App path: /var/www/api.workspace97th.97dev.com
# PHP-FPM : php8.5-fpm
# Server  : Ubuntu / Debian
#
# INSTALLATION
# ------------
# bash vhost/testing.sh
# =============================================================================

server {
    listen 80;
    server_name api.workspace97th.97dev.com;

    root  /var/www/api.workspace97th.97dev.com/public;
    index index.php;

    access_log /var/log/nginx/api.workspace97th.97dev.com.access.log;
    error_log  /var/log/nginx/api.workspace97th.97dev.com.error.log;

    client_max_body_size 50M;

    # Laravel — route all requests through index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
    }

    # Deny access to dot files (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Deny access to sensitive Laravel directories
    location ~* ^/(storage|bootstrap/cache) {
        deny all;
    }
}
